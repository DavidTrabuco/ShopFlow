<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste login Google</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    pre { background: #f4f4f4; padding: 12px; border-radius: 6px; overflow: auto; }
    button { padding: 8px 14px; margin-right: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Teste: login com Google</h1>
  <p>Página só para testar o endpoint <code>POST /api/v1/auth/google</code> em desenvolvimento.</p>

  <div id="botao-google"></div>

  <p>
    <button id="btn-me">GET /auth/me</button>
    <button id="btn-logout">POST /auth/logout</button>
  </p>

  <h3>idToken (para colar no Swagger)</h3>
  <textarea id="token" rows="4" style="width:100%" readonly placeholder="Aparece aqui depois do login com Google"></textarea>

  <h3>Resposta</h3>
  <pre id="saida">Faça login para ver a resposta.</pre>

  <script>
    const saida = document.getElementById("saida");
    const mostrar = (titulo, status, corpo) =>
      saida.textContent = `${titulo}\nHTTP ${status}\n\n${JSON.stringify(corpo, null, 2)}`;

    async function chamar(titulo, url, opcoes = {}) {
      const r = await fetch(url, { credentials: "same-origin", ...opcoes });
      const texto = await r.text();
      let corpo = texto;
      try { corpo = texto ? JSON.parse(texto) : null; } catch { /* resposta sem JSON */ }
      mostrar(titulo, r.status, corpo);
    }

    // O Google chama esta função com o idToken (credential) depois do login
    function aoLogar(resposta) {
      document.getElementById("token").value = resposta.credential;
      chamar("POST /api/v1/auth/google", "/api/v1/auth/google", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idToken: resposta.credential })
      });
    }

    // O Client ID vem da própria API (variável Google__ClientId), então não precisa colar aqui
    window.onload = async () => {
      const r = await fetch("/api/v1/auth/google/config");
      const { clientId } = await r.json();

      if (!clientId) {
        saida.textContent = "A API está sem Google__ClientId configurado (variável de ambiente no Render).";
        return;
      }

      google.accounts.id.initialize({ client_id: clientId, callback: aoLogar });
      google.accounts.id.renderButton(document.getElementById("botao-google"), { theme: "outline", size: "large" });
    };

    document.getElementById("btn-me").onclick = () => chamar("GET /api/v1/auth/me", "/api/v1/auth/me");
    document.getElementById("btn-logout").onclick = () =>
      chamar("POST /api/v1/auth/logout", "/api/v1/auth/logout", { method: "POST" });
  </script>
</body>
</html>
